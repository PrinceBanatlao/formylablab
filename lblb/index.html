<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorry sa aking pinakamamahal na tao</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-bg: #121212;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
            --accent: #ff4d6d; /* A soft romantic accent color */
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Blurred Background using the first image */
        .bg-blur {
            position: absolute;
            top: -20%; left: -20%; right: -20%; bottom: -20%;
            background-image: url('https://cdn.discordapp.com/attachments/1464151364144730198/1555623173846995005/IMG_20261003_004951_611.jpg?backend=b2&ex=6ac1327a&is=6abfe0fa&hm=09403a58cfc97ea8223ced5e25ee278912dc1bc6a83e4057344691ea00307c3d&');
            background-size: cover;
            background-position: center;
            filter: blur(50px) brightness(0.35);
            z-index: -1;
            animation: pulse 10s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        .player-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 850px;
            background: rgba(25, 25, 25, 0.4);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 40px;
            padding: 40px 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
            position: relative;
        }

        /* Mobile specific adjustments to make it full screen */
        @media (max-width: 480px) {
            .player-container {
                height: 100vh;
                max-height: none;
                border-radius: 0;
                border: none;
                justify-content: center;
                padding: 30px 25px;
            }
        }

        /* Top bar (fake) */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            font-size: 18px;
            color: var(--text-main);
        }

        .top-bar i {
            cursor: pointer;
            transition: color 0.2s;
        }

        .top-bar i:hover {
            color: var(--accent);
        }

        .top-bar span {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-sub);
        }

        /* Artwork / Slideshow */
        .artwork-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 30px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            margin-bottom: 40px;
            background: #000;
        }

        .slideshow img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 2s ease-in-out, transform 6s ease-out;
            transform: scale(1.1);
        }

        .slideshow img.active {
            opacity: 1;
            transform: scale(1);
        }

        /* Track Info */
        .info {
            text-align: left;
            margin-bottom: 35px;
        }

        .info h1 {
            font-size: 26px;
            font-weight: 700;
            margin: 0 0 10px 0;
            line-height: 1.3;
            background: linear-gradient(90deg, #ffffff, #ffb3c1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(255, 77, 109, 0.2);
        }

        .info p {
            font-size: 16px;
            color: var(--text-sub);
            margin: 0;
            font-weight: 400;
        }

        /* Progress Bar */
        .progress-area {
            width: 100%;
            margin-bottom: 30px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #fff, var(--accent));
            border-radius: 4px;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 77, 109, 0.6);
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
        }

        .progress-bar:hover .progress-fill::after {
            opacity: 1;
            transform: translateY(-50%) scale(1.2);
        }

        .time {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            margin-top: 12px;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 35px;
        }

        .controls button {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .controls button:hover {
            color: var(--accent);
            transform: scale(1.15);
        }

        .controls .play-btn {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: var(--text-main) !important;
            color: var(--primary-bg) !important;
            font-size: 28px !important;
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.2);
            padding-left: 5px; /* Offset to center play icon visually */
        }

        .controls .play-btn.playing {
            padding-left: 0; /* reset for pause icon */
        }

        .controls .play-btn:hover {
            transform: scale(1.08) !important;
            box-shadow: 0 15px 35px rgba(255, 255, 255, 0.3);
            color: var(--primary-bg) !important; /* Keep icon color solid */
        }

        /* Small actions */
        .actions {
            display: flex;
            justify-content: space-between;
            margin-top: auto;
            color: var(--text-sub);
            font-size: 20px;
        }

        .actions i {
            cursor: pointer;
            transition: color 0.2s;
        }

        .actions i:hover {
            color: var(--text-main);
        }
        
        .actions .fa-heart:hover {
            color: var(--accent);
        }

    </style>
</head>
<body>

    <div class="bg-blur"></div>

    <div class="player-container">
        <!-- Top bar representing music player UI -->
        <div class="top-bar">
            <i class="fas fa-chevron-down"></i>
            <span>Playing from Playlist</span>
            <i class="fas fa-ellipsis-h"></i>
        </div>

        <div class="artwork-container">
            <div class="slideshow">
                <img src="https://cdn.discordapp.com/attachments/1464151364144730198/1555623173846995005/IMG_20261003_004951_611.jpg?backend=b2&ex=6ac1327a&is=6abfe0fa&hm=09403a58cfc97ea8223ced5e25ee278912dc1bc6a83e4057344691ea00307c3d&" class="active" alt="Image 1">
                <img src="https://cdn.discordapp.com/attachments/1464151364144730198/1555623173037363200/IMG_20261003_005011_487.jpg?backend=b2&ex=6ac1327a&is=6abfe0fa&hm=3a5fe047d578da0384a3bb208bbd7217c58852948c2537e319bcb52fa5b9c97b&" alt="Image 2">
                <img src="https://cdn.discordapp.com/attachments/1464151364144730198/1555623172257091727/IMG_20261003_005033_506.jpg?backend=b2&ex=6ac1327a&is=6abfe0fa&hm=ab6ff37c4252c405fcfff2c933a1888643bef4be6344aa5a099441bfcd4eafa8&" alt="Image 3">
                <img src="https://cdn.discordapp.com/attachments/1464151364144730198/1555623171242332231/IMG_20261003_005049_472.jpg?backend=b2&ex=6ac1327a&is=6abfe0fa&hm=c17b2769e4cd64ffe7fb490e66f0e3d716fa427261ce12d1b32ffa19ccb27b79&" alt="Image 4">
            </div>
        </div>

        <div class="info">
            <h1>Sorry sa aking pinakamamahal na tao</h1>
            <p>Para Sa'yo</p>
        </div>

        <div class="progress-area">
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="time">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="controls">
            <button id="prevBtn" title="Previous"><i class="fas fa-backward-step"></i></button>
            <button id="playBtn" class="play-btn" title="Play"><i class="fas fa-play"></i></button>
            <button id="nextBtn" title="Next"><i class="fas fa-forward-step"></i></button>
        </div>

        <div class="actions">
            <i class="fas fa-heart"></i>
            <i class="fas fa-share-nodes"></i>
        </div>

        <!-- The actual audio/video file -->
        <audio id="mainAudio" src="sorrymp3.mp4" preload="metadata"></audio>
    </div>

    <script>
        const audio = document.getElementById('mainAudio');
        const playBtn = document.getElementById('playBtn');
        const playIcon = playBtn.querySelector('i');
        const images = document.querySelectorAll('.slideshow img');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');

        let currentImg = 0;
        let intervalId = null;

        // Slideshow Functions
        function startSlideshow() {
            if (intervalId) return; // Prevent multiple intervals
            intervalId = setInterval(() => {
                images[currentImg].classList.remove('active');
                currentImg = (currentImg + 1) % images.length;
                images[currentImg].classList.add('active');
            }, 4500); // Crossfade every 4.5 seconds
        }

        function stopSlideshow() {
            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
            }
        }

        // Play / Pause Logic
        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playIcon.classList.remove('fa-play');
                playIcon.classList.add('fa-pause');
                playBtn.classList.add('playing');
                startSlideshow();
            } else {
                audio.pause();
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play');
                playBtn.classList.remove('playing');
                stopSlideshow();
            }
        });

        // Format time properly (e.g. 0:05, 1:20)
        function formatTime(time) {
            if (isNaN(time)) return "0:00";
            let min = Math.floor(time / 60);
            let sec = Math.floor(time % 60);
            if (sec < 10) sec = `0${sec}`;
            return `${min}:${sec}`;
        }

        // Update progress bar as audio plays
        audio.addEventListener('timeupdate', () => {
            const currentTime = audio.currentTime;
            const duration = audio.duration;
            
            if (duration) {
                const progressWidth = (currentTime / duration) * 100;
                progressFill.style.width = `${progressWidth}%`;
                currentTimeEl.innerText = formatTime(currentTime);
            }
        });

        // Set total duration when audio metadata is loaded
        audio.addEventListener('loadedmetadata', () => {
            durationEl.innerText = formatTime(audio.duration);
        });

        // Click on progress bar to seek
        progressBar.addEventListener('click', (e) => {
            const width = progressBar.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            audio.currentTime = (clickX / width) * duration;
            
            // If the user seeks before pressing play, let's play it automatically
            if (audio.paused) {
                audio.play();
                playIcon.classList.remove('fa-play');
                playIcon.classList.add('fa-pause');
                playBtn.classList.add('playing');
                startSlideshow();
            }
        });

        // Reset when audio ends
        audio.addEventListener('ended', () => {
            playIcon.classList.remove('fa-pause');
            playIcon.classList.add('fa-play');
            playBtn.classList.remove('playing');
            stopSlideshow();
            
            // Reset to first image optionally, or just leave it
            // images.forEach(img => img.classList.remove('active'));
            // currentImg = 0;
            // images[currentImg].classList.add('active');
            
            audio.currentTime = 0;
            progressFill.style.width = `0%`;
        });
        
        // Next and Prev dummy buttons
        document.getElementById('nextBtn').addEventListener('click', () => {
            // Just restart the song or seek forward 10 seconds
            audio.currentTime = Math.min(audio.currentTime + 10, audio.duration);
        });
        
        document.getElementById('prevBtn').addEventListener('click', () => {
            // Seek back 10 seconds
            audio.currentTime = Math.max(audio.currentTime - 10, 0);
        });
    </script>
</body>
</html>
